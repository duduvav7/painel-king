<style>
  :root{
    --bg:#0c0c0e; --card:#151519; --card2:#18181d; --line:#26262c;
    --tx:#f4f4f5; --mut:#9b9ba3; --orange:#f79220; --orange2:#ffb054;
    --up:#ff5d5d; --down:#3ddc84;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--tx);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }
  /* ---------- header ---------- */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:16px;
    padding:10px 22px; border-bottom:2px solid var(--orange);
    background:linear-gradient(180deg,#131316,#0c0c0e);
  }
  header img{height:52px}
  header .t{display:flex; flex-direction:column; line-height:1.15}
  header .t b{font-size:17px; letter-spacing:.06em}
  header .t span{font-size:11.5px; color:var(--mut); letter-spacing:.18em; text-transform:uppercase}
  header .sp{flex:1}
  .chip{
    border:1px solid var(--line); background:var(--card); color:var(--mut);
    border-radius:20px; padding:6px 14px; font-size:12.5px; white-space:nowrap;
  }
  .chip b{color:var(--orange); font-weight:600}
  /* ---------- grid ---------- */
  main{
    flex:1 1 auto; min-height:0; display:grid; gap:12px; padding:12px 14px 14px;
    grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 16px 12px; display:flex; flex-direction:column; min-height:0;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  .card h2{
    font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--orange); font-weight:700; margin-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }
  .card h2 small{color:var(--mut); letter-spacing:.04em; font-weight:400; text-transform:none; font-size:11px; margin-left:auto}
  .body{
    flex:1; min-height:0; overflow:auto;
    scrollbar-width:thin; scrollbar-color:#33333c transparent;
    --fadeT:0px; --fadeB:0px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 var(--fadeT),#000 calc(100% - var(--fadeB)),transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 var(--fadeT),#000 calc(100% - var(--fadeB)),transparent 100%);
    padding-right:6px;
  }
  .body::-webkit-scrollbar{width:9px}
  .body::-webkit-scrollbar-track{background:transparent}
  .body::-webkit-scrollbar-thumb{
    background:#2b2b33; border-radius:8px;
    border:2.5px solid var(--card); background-clip:padding-box;
  }
  .body:hover::-webkit-scrollbar-thumb{background:#43434e; border:2.5px solid var(--card); background-clip:padding-box}
  .body::-webkit-scrollbar-thumb:hover{background:var(--orange); border:2.5px solid var(--card); background-clip:padding-box}
  /* KPI rows */
  .kv{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px dashed #222228; font-size:13.5px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--mut)}
  .kv .v{font-weight:600; font-variant-numeric:tabular-nums}
  .big{font-size:26px; font-weight:700; color:var(--tx); margin:2px 0 4px; font-variant-numeric:tabular-nums}
  .big.orange{color:var(--orange)}
  .neg{color:var(--up)} .pos{color:var(--down)} .mutv{color:var(--mut); font-weight:400} .inv{color:#5ac8fa}
  /* tables */
  table{width:100%; border-collapse:collapse; font-size:12.8px}
  td{padding:4.5px 4px; border-bottom:1px dashed #222228; vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .pct{display:inline-block; min-width:58px; text-align:center; border-radius:6px; padding:2px 6px; font-weight:700; font-size:12px}
  .pct.up{background:rgba(255,93,93,.13); color:var(--up)}
  .pct.dn{background:rgba(61,220,132,.12); color:var(--down)}
  .prod{color:var(--tx)} .sub{color:var(--mut); font-size:11px}
  /* variação: linha compacta */
  .vr{display:flex; align-items:center; gap:8px; padding:3px 0; border-bottom:1px dashed #222228; font-size:12.6px}
  .vr:last-of-type{border-bottom:none}
  .vr .vp{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .vr .vs{color:var(--mut); font-size:11px; white-space:nowrap; font-variant-numeric:tabular-nums}
  .tag{display:inline-block; border-radius:6px; padding:1px 8px; font-size:11px; letter-spacing:.06em}
  .tag.up{background:rgba(255,93,93,.15); color:var(--up)}
  .tag.dn{background:rgba(61,220,132,.13); color:var(--down)}
  /* quebra ranking */
  .rk{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed #222228; font-size:14px}
  .rk:last-child{border-bottom:none}
  .rk .pos{flex:0 0 26px; height:26px; border-radius:50%; background:var(--card2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--mut)}
  .rk.win .pos{background:var(--orange); color:#111; border-color:var(--orange)}
  .rk .nm{flex:1; font-weight:600}
  .rk .vl{font-variant-numeric:tabular-nums; font-weight:700; color:var(--up)}
  .rk .bar{flex:0 0 34%; height:7px; background:#222228; border-radius:4px; overflow:hidden}
  .rk .bar i{display:block; height:100%; background:var(--orange)}
  /* pendências */
  .pend{display:flex; gap:9px; padding:4px 0; border-bottom:1px dashed #222228; font-size:12.8px; line-height:1.45}
  .pend:last-child{border-bottom:none}
  .dot{flex:0 0 auto; margin-top:5px; width:8px; height:8px; border-radius:50%; background:var(--orange)}
  .pend.warn .dot{background:var(--up)}
  /* programado */
  .rod{padding:6px 0; border-bottom:1px dashed #222228; font-size:12.8px}
  .rod:last-child{border-bottom:none}
  .rod b{display:block; font-weight:600}
  .rod span{color:var(--mut); font-size:12px}
  .rod .when{color:var(--orange2); font-weight:600}
  .note{font-size:11px; color:var(--mut); margin-top:4px; line-height:1.35}
  ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:#2c2c33; border-radius:3px}
  @media (min-height:900px){
    header img{height:62px}
    header .t b{font-size:20px} header .t span{font-size:13px}
    .chip{font-size:14px; padding:8px 16px}
    .card{padding:18px 22px 16px}
    .card h2{font-size:13.5px; margin-bottom:12px} .card h2 small{font-size:12.5px}
    .kv{font-size:16.5px; padding:9px 0}
    .big{font-size:34px}
    table{font-size:15.5px} td{padding:8px 4px}
    .pct{font-size:14px; min-width:70px}
    .vr{font-size:14.5px; padding:6px 0}
    .vr .vs{font-size:12px}
    .sub{font-size:12.5px}
    .pend{font-size:15.5px; padding:10px 0}
    .rod{font-size:15.5px; padding:10px 0} .rod span{font-size:14px}
    .note{font-size:13px; margin-top:10px}
  }
</style>

<style>
/* versão nuvem: celular = 1 coluna com rolagem (o Site KB do PC continua 1 página sem rolagem) */
@media (max-width:820px){
  html,body{height:auto}
  body{height:auto;min-height:100vh;overflow-y:auto;overflow-x:hidden;display:block}
  header{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}
  header img{height:40px}
  header .t b{font-size:15px}
  header .t span{font-size:10.5px;letter-spacing:.12em}
  header .sp{display:none}
  .chip{font-size:12px;padding:5px 11px}
  main{display:flex;flex-direction:column;gap:12px;padding:12px}
  .card{min-height:auto;max-width:100%;overflow:hidden}
  .body{overflow:visible;-webkit-mask-image:none!important;mask-image:none!important;padding-right:0}
  .vr .vp{white-space:normal;overflow:visible;text-overflow:clip}
}
</style>

<script>
const D = window.KING_DATA || {};
const brl = v => v==null ? '—' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const el = id => document.getElementById(id);

el('chip-mes').innerHTML = '<b>'+(D.mes||'')+'</b>';
el('chip-at').textContent = D.atualizadoEm||'—';
el('c-mes').textContent = (D.mes||'').toLowerCase();

/* caixa */
(()=>{ const c=D.caixa||{};
  el('card-caixa').innerHTML =
   `<div class="kv"><span class="k">Caixa inicial</span><span class="v">${brl(c.inicial)}</span></div>
    <div class="kv"><span class="k">Vendas (CPlug)</span><span class="v ${c.vendas==null?'mutv':''}" style="${c.vendas==null?'':'color:#2f4f8f'}">${brl(c.vendas)}</span></div>
    <div class="kv"><span class="k">Saídas (gastos + despesas)</span><span class="v neg">− ${brl(c.saidas).replace('R$','R$ ').trim()}</span></div>
    <div class="kv"><span class="k">Entradas extras</span><span class="v pos">+ ${brl(c.extras)}</span></div>
    ${c.investimentos?`<div class="kv"><span class="k">Investimento (renda fixa)</span><span class="v inv">− ${brl(c.investimentos)}</span></div>`:''}
    ${c.resgates?`<div class="kv"><span class="k">Resgate (renda fixa)</span><span class="v pos">+ ${brl(c.resgates)}</span></div>`:''}
    ${c.vendas!=null?`<div class="kv"><span class="k">Taxa maquininha (0,98%)</span><span class="v neg">− ${brl(c.vendas*0.0098)}</span></div>`:''}
    ${(c.vendas!=null&&(D.caixaDetalhado||{}).gastos!=null)?(l=>`<div class="kv"><span class="k">Lucro Bruto</span><span class="v" style="color:#2f4f8f">${brl(l)} <span class="sub">(${(c.vendas?l/c.vendas*100:0).toFixed(1).replace('.',',')}%)</span></span></div>`)(c.vendas-((D.caixaDetalhado||{}).gastos-(c.maickExtra||0))):''}
    ${(c.vendas!=null&&c.saidas!=null)?(l=>`<div class="kv"><span class="k">Lucro Líquido</span><span class="v ${l>=0?'pos':'neg'}">${brl(l)} <span class="sub">(${(c.vendas?l/c.vendas*100:0).toFixed(1).replace('.',',')}%)</span></span></div>`)(c.vendas-(c.saidas-(c.maickExtra||0))-c.vendas*0.0098):''}
    <div class="kv"><span class="k" style="color:var(--tx);font-weight:600">Caixa atual</span>
      <span class="big orange" style="margin:0">${c.atual==null?'—':brl(c.atual)}</span></div>
    ${c.investidoAcumulado!=null?`<div class="kv" style="border-top:1px solid var(--line)"><span class="k" style="color:var(--tx);font-weight:600">Aplicado em renda fixa</span><span class="v" style="color:#2f4f8f;font-weight:700">${brl(c.investidoAcumulado)}</span></div>
    <div class="kv" style="margin-top:-6px"><span class="k"></span><span class="v"><span class="sub">saldo acumulado · não entra no lucro</span></span></div>`:''}
    ${(p=>`<div class="kv" style="border-top:1px solid var(--line)"><span class="k">Gastos (mercadoria)</span><span class="v">${brl(p.gastos)} <span class="sub">· ${p.nGastos||0} lanç.</span></span></div>
    <div class="kv" style="margin-top:-6px"><span class="k"></span><span class="v"><span class="sub">(− ${brl(c.maickExtra||0)} maick)</span></span></div>
    <div class="kv"><span class="k">Despesas</span><span class="v">${brl(p.despesas)} <span class="sub">· ${p.nDespesas||0} lanç.</span></span></div>`)(D.caixaDetalhado||{})}
    ${c.obs?`<div class="note">⚠️ ${c.obs}</div>`:''}`;
})();

/* estoque baixo */
(()=>{ const e=D.estoqueBaixo||{}; const itens=e.itens||[];
  el('est-at').textContent = e.verificadoEm ? 'varredura de '+e.verificadoEm : 'quinta · 9h';
  el('card-estoque').innerHTML = e.verificadoEm
   ? (itens.length
      ? `<table>${itens.map(x=>
          `<tr><td><span class="prod">${x.produto}</span>${x.categoria?`<br><span class="sub">${x.categoria}</span>`:''}</td>
           <td class="r"><span class="pct up">${x.qtd}</span><span class="sub"> / mín ${x.minimo??'—'}</span></td></tr>`).join('')}</table>
        <div class="note">${itens.length} produto(s) abaixo do mínimo da categoria (Control\\Estoque_Minimo.xlsx)</div>`
      : '<div class="note">Nenhum produto abaixo do mínimo. ✅</div>')
   : '<div class="note">Primeira varredura ainda não rodou — acontece toda quinta às 9h.</div>';
})();

/* variações alta / queda */
function varRows(list, up){
  return (list||[]).map(v=>
    `<div class="vr"><span class="vp" title="${v.produto}">${v.produto}</span>
     <span class="vs">${brl(v.antigo)} → ${brl(v.atual)} · ${v.data}</span>
     <span class="pct ${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(v.pct).toFixed(1).replace('.',',')}%</span></div>`).join('');
}
(()=>{ const a=D.variacoesAlta||[], q=D.variacoesQueda||[];
  el('card-alta').innerHTML = a.length ? varRows(a,true)+`<div class="note">${a.length} alta(s) de custo nas últimas 2 semanas · da maior pra menor · % sobre o custo anterior</div>` : '<div class="note">Nenhuma alta de custo nas últimas 2 semanas. 👌</div>';
  el('card-queda').innerHTML = q.length ? varRows(q,false)+`<div class="note">${q.length} queda(s) de custo nas últimas 2 semanas · da maior pra menor · % sobre o custo anterior</div>` : '<div class="note">Nenhuma queda de custo nas últimas 2 semanas.</div>';
})();

/* ranking quebra de caixa */
(()=>{ const r=(D.quebraRanking||[]).slice().sort((x,y)=>y.valor-x.valor);
  el('qb-at').textContent = D.mes ? 'acumulado · '+D.mes.toLowerCase() : '';
  const max=r.length?r[0].valor:0, tot=r.reduce((s,x)=>s+x.valor,0);
  const liq=D.quebraLiquida;
  const liqTxt = liq==null ? '—' : (liq>=0?'+ ':'− ')+brl(Math.abs(liq));
  const liqCor = liq==null ? 'var(--mut)' : (liq>=0?'var(--down)':'var(--up)');
  const o=D.ofertasEconomia;
  const ofertasHtml = (o&&(o.totalMes!=null||o.total!=null))
   ? `<div class="note" style="margin-top:6px;padding-top:6px;border-top:1px dashed #222228">
        <div style="text-align:center">
          <span style="text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--mut)">Economia das ofertas</span><br>
          <b style="font-size:17px;color:var(--down)">${brl(o.totalMes!=null?o.totalMes:o.total)}</b><br>
          <span class="sub">acumulado do mês, vs custo normal</span>
        </div>
        ${(o.itens&&o.itens.length)?`<div style="margin-top:6px"><span style="text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--mut)">Lista da semana${o.lista?' · '+o.lista:''}</span></div>`
          + o.itens.map(x=>`<div class="kv" style="margin:1px 0 0"><span class="k">${x.produto}</span><span class="v pos">${brl(x.valor)}</span></div>`).join(''):''}
      </div>`
   : '';
  el('card-quebra').innerHTML = (r.length
   ? r.map((x,i)=>`<div class="rk${i===r.length-1?' win':''}"><span class="pos">${i+1}º</span><span class="nm">${x.nome}</span>
       <span class="bar"><i style="width:${max?Math.round(x.valor/max*100):0}%"></i></span>
       <span class="vl">${brl(x.valor)}</span></div>`).join('')
     + `<div class="note">Total de quebra no período: <b style="color:var(--up)">${brl(tot)}</b> · não entra no caixa (controle paralelo)</div>`
     + `<div class="note" style="margin-top:6px;padding-top:6px;border-top:1px dashed #222228">
          <span style="text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--mut)">Quebra de caixa líquida</span><br>
          <b style="font-size:15px;color:${liqCor}">${liqTxt}</b>
          <span class="sub"> · com sinal, pra bater com o físico vs. caixa atual</span>
        </div>`
   : '<div class="note">Nenhuma quebra registrada até agora. 👌</div>')
   + ofertasHtml;
})();

/* produtos pendentes da semana */
(()=>{ const p=D.pendentesSemana||{}; const fora=p.fora||[], zer=p.zerados||[];
  el('pend-sem').textContent = p.semana ? 'cotação '+p.semana : '';
  el('card-pendentes').innerHTML =
    (fora.length
      ? fora.map(x=>`<div class="pend warn"><span class="dot"></span><div><b>${x.produto}</b> <span class="sub">· pedido: ${x.qtd||'—'}</span></div></div>`).join('')
      : '<div class="note">Tudo que estava na lista entrou em alguma tabela. ✅</div>')
    + (zer.length
      ? `<div class="note" style="margin-top:8px">Na tabela com qtd 0: ${zer.map(z=>`<b>${z.produto}</b> (${z.motivo})`).join(' · ')}</div>`
      : '')
    + `<div class="note">Da lista da semana, fora de todas as tabelas — conferido a cada fechamento da cotação.</div>`;
})();

/* fade suave no topo/rodapé dos cards com scroll */
(()=>{
  const F='18px';
  document.querySelectorAll('.body').forEach(b=>{
    const upd=()=>{
      const canT=b.scrollTop>4;
      const canB=b.scrollHeight-b.clientHeight-b.scrollTop>4;
      b.style.setProperty('--fadeT',canT?F:'0px');
      b.style.setProperty('--fadeB',canB?F:'0px');
    };
    b.addEventListener('scroll',upd,{passive:true});
    new ResizeObserver(upd).observe(b);
    upd();
  });
})();
</script>
</body>
</html>
